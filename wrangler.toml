name = "the-furnace-isnt-free"
main = "src/worker.js"
compatibility_date = "2026-10-31"
compatibility_flags = ["nodejs_compat"]

# Static site. API routes are handled in the Worker before assets.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
# The Worker must see Host before static assets. Otherwise www and extensionless
# HTML paths are answered by the asset layer (200 or a temporary 307) and the
# script's 301 never runs. API routes are included because the Worker runs for
# every path, then calls env.ASSETS.fetch for files it does not handle.
run_worker_first = true

# Create these in Cloudflare before deploy. Leave them unset until then.
# Durable page views and receipts need SITE_KV.
# Private JPEG bytes should use UPLOADS (R2). Without R2, KV stores JPEGs up to 2 MB.
#
# [[kv_namespaces]]
# binding = "SITE_KV"
# id = "OWNER_KV_NAMESPACE_ID"
#
# [[r2_buckets]]
# binding = "UPLOADS"
# bucket_name = "the-furnace-isnt-free-private"

[vars]
CANONICAL_ORIGIN = "https://furnaceisntfree.com"
# Cos placeholder. Leave this empty in git. Do not commit a SHA here.
# scripts/write-build-provenance.mjs records git HEAD into the bundle
# (npm test, npm run build, and the [build] command before wrangler deploy).
# Workers Builds injects WORKERS_CI_COMMIT_SHA into the build environment;
# the script uses git HEAD first, then that variable.
# A runtime value is used only when it is 40 hex characters. This empty
# string is ignored, so a hand-written label cannot go stale in this file.
# Override only when the build machine has no git checkout:
#   npx wrangler deploy --var SOURCE_BASE_TIP:<40-hex-sha>
SOURCE_BASE_TIP = ""

# Custom domains stay commented. Binding www.furnaceisntfree.com is a Cloudflare
# zone action. Application code cannot attach that hostname, and this file is not
# a deploy. The Worker 301s GET/HEAD from www to the apex only when the request
# actually reaches this script. If public www is served by another route, an
# approved later deploy must uncomment the www custom domain on the owning account.
# [[routes]]
# pattern = "furnaceisntfree.com"
# custom_domain = true
#
# [[routes]]
# pattern = "www.furnaceisntfree.com"
# custom_domain = true
CORPUS_FORWARD_IMAGES = "false"

# Cloudflare Worker version id, tag, and timestamp.
# Present on a deployed version. Local dev does not supply a version UUID.
# CF-Ray is a per-request id and is not this version id.
[version_metadata]
binding = "CF_VERSION_METADATA"

# wrangler deploy and wrangler dev run this before bundling.
# Workers Builds does not copy this block into the dashboard build command.
# npx wrangler deploy still runs it. If a pipeline bundles without wrangler,
# set that build command to: node scripts/write-build-provenance.mjs
# This block does not deploy the Worker.
[build]
command = "node scripts/write-build-provenance.mjs"
watch_dir = ["src", "public", "scripts"]
